name: Backfill contract history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive start date in YYYY-MM-DD format
        required: true
      end_date:
        description: Inclusive end date in YYYY-MM-DD format
        required: true
      window_days:
        description: Days per source query window
        required: false
        default: "7"
      max_windows:
        description: Windows processed during this run
        required: false
        default: "1"
      max_amended_contracts:
        description: Highest-value amendment contracts retained per window
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: update-contract-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out private contract state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slicedearth/contract-delta-au-data
          path: .private-data
          ssh-key: ${{ secrets.PRIVATE_DATA_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -e '.[dev]'

      - name: Resume bounded history
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          WINDOW_DAYS: ${{ inputs.window_days || '7' }}
          MAX_WINDOWS: ${{ inputs.max_windows || '1' }}
          MAX_AMENDED_CONTRACTS: ${{ inputs.max_amended_contracts || '20' }}
        run: >-
          contract-delta --data-root .private-data backfill
          --from "$START_DATE"
          --to "$END_DATE"
          --window-days "$WINDOW_DAYS"
          --max-windows "$MAX_WINDOWS"
          --max-amended-contracts "$MAX_AMENDED_CONTRACTS"

      - name: Verify Python output
        run: |
          ruff check .
          pytest --cov=contract_delta --cov-report=term-missing --cov-fail-under=75
          pip-audit --skip-editable

      - name: Check published source links
        run: contract-delta check-source-links

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Verify site build
        working-directory: site
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
          npm run build

      - name: Commit private state and progress
        run: |
          if [[ -z "$(git -C .private-data status --porcelain -- data)" ]]; then
            echo "No private state changes detected."
          else
            git -C .private-data config user.name "contractdelta-bot"
            git -C .private-data config user.email "contractdelta-bot@users.noreply.github.com"
            git -C .private-data add data
            git -C .private-data commit \
              -m "Advance bounded contract history" \
              -m "Process the next configured historical windows and record resumable progress. Preserve normalised history, immutable field events, retrieval metadata, coverage counts, and checkpoint state after the verified build."
            git -C .private-data push
          fi

      - name: Publish non-identifying update status
        run: |
          DATA_REVISION=$(git -C .private-data rev-parse HEAD)
          contract-delta \
            --data-root .private-data \
            publish-status \
            --data-revision "$DATA_REVISION"
          git restore -- site/src/data/dashboard.json
          git config user.name "contractdelta-bot"
          git config user.email "contractdelta-bot@users.noreply.github.com"
          git add site/src/data/update-status.json
          if git diff --cached --quiet; then
            echo "Public update status is unchanged."
            exit 0
          fi
          git commit \
            -m "Record verified history progress" \
            -m "Publish non-identifying retrieval, coverage, checkpoint, and dataset-count metadata for the latest verified private-state revision. Trigger a fresh static deployment without committing contract histories or generated evidence to public version control."
          git push
