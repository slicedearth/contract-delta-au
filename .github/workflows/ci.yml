name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Test Python
        run: pytest --cov=contract_delta --cov-report=term-missing --cov-fail-under=75

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Generate privacy-minimised site fixture
        run: >-
          contract-delta
          --data-root "$RUNNER_TEMP/contract-delta-fixture"
          ingest-fixture
          tests/fixtures/amended_releases.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Check site
        working-directory: site
        run: npm run check

      - name: Audit site dependencies
        working-directory: site
        run: npm audit --audit-level=high

      - name: Build site
        working-directory: site
        run: npm run build
