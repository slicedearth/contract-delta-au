name: Update contract data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to query by latest-modified date
        required: false
        default: "8"
      max_amended_contracts:
        description: Highest-value amendment contracts retained from the interval
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: update-contract-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out private contract state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slicedearth/contract-delta-au-data
          path: .private-data
          ssh-key: ${{ secrets.PRIVATE_DATA_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -e '.[dev]'

      - name: Fetch and compare records
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
          MAX_AMENDED_CONTRACTS: ${{ inputs.max_amended_contracts || '20' }}
        run: >-
          contract-delta --data-root .private-data update
          --lookback-days "$LOOKBACK_DAYS"
          --amendments-only
          --max-amended-contracts "$MAX_AMENDED_CONTRACTS"

      - name: Verify Python output
        run: |
          ruff check .
          pytest --cov=contract_delta --cov-report=term-missing --cov-fail-under=75
          pip-audit --skip-editable

      - name: Check published source links
        run: contract-delta check-source-links

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Verify site build
        working-directory: site
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
          npm run build

      - name: Commit private state when changed
        run: |
          if [[ -z "$(git -C .private-data status --porcelain -- data)" ]]; then
            echo "No private state changes detected."
          else
            git -C .private-data config user.name "contractdelta-bot"
            git -C .private-data config user.email "contractdelta-bot@users.noreply.github.com"
            git -C .private-data add data
            git -C .private-data commit \
              -m "Update bounded contract state" \
              -m "Process the configured latest-modified interval and retain the highest-value bounded amendment set. Preserve normalised history, immutable field events, retrieval metadata, coverage counts, and resumable state after the verified build."
            git -C .private-data push
          fi

      - name: Publish non-identifying update status
        run: |
          DATA_REVISION=$(git -C .private-data rev-parse HEAD)
          contract-delta \
            --data-root .private-data \
            publish-status \
            --data-revision "$DATA_REVISION"
          git restore -- site/src/data/dashboard.json
          git config user.name "contractdelta-bot"
          git config user.email "contractdelta-bot@users.noreply.github.com"
          git add site/src/data/update-status.json
          if git diff --cached --quiet; then
            echo "Public update status is unchanged."
            exit 0
          fi
          git commit \
            -m "Record verified dataset update" \
            -m "Publish non-identifying retrieval, coverage, and dataset-count metadata for the latest verified private-state revision. Trigger a fresh static deployment without committing contract histories or generated evidence to public version control."
          git push
