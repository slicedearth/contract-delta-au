name: Update contract data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to query by latest-modified date
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: update-contract-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -e '.[dev]'

      - name: Fetch and compare records
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
        run: contract-delta update --lookback-days "$LOOKBACK_DAYS"

      - name: Verify Python output
        run: |
          ruff check .
          pytest --cov=contract_delta --cov-report=term-missing --cov-fail-under=75
          pip-audit --skip-editable

      - name: Check published source links
        run: contract-delta check-source-links

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Verify site build
        working-directory: site
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
          npm run build

      - name: Commit derived data when changed
        run: |
          if git diff --quiet -- data/state data/events site/src/data site/public/data site/public/evidence; then
            echo "No source changes detected."
            exit 0
          fi
          git config user.name "contractdelta-bot"
          git config user.email "contractdelta-bot@users.noreply.github.com"
          git add data site/src/data site/public/data site/public/evidence
          git commit -m "Update contract change data"
          git push
